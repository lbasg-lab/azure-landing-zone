name: CD

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main

jobs:
  cd:
    uses: lbasg-lab/cicd-pipelines/.github/workflows/cd.yml@v2.1.0
    with:
      config: .cicd-config.yml
    secrets:
      HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      